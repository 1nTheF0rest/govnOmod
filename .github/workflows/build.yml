name: Build govnOmod

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'builds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build mod
        run: gradle clean build --refresh-dependencies --no-daemon --stacktrace

      - name: Copy ready JAR to builds
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/govnOmod-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "ERROR: Gradle finished without producing build/libs/govnOmod-*.jar"
            find build -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          rm -f builds/govnOmod-*.jar
          main_jar=""
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-dev.jar) ;;
              *) main_jar="$jar"; break ;;
            esac
          done

          if [ -z "$main_jar" ]; then
            echo "ERROR: No production JAR found."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "$main_jar" "builds/govnOmod-1.21.11.jar"
          echo "Copied $main_jar -> builds/govnOmod-1.21.11.jar"

      - name: Commit JAR to builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/govnOmod-1.21.11.jar
          if git diff --cached --quiet; then
            echo "JAR is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Build govnOmod JAR"
          git push

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: govnOmod-1.21.11
          path: builds/govnOmod-1.21.11.jar
          if-no-files-found: error
